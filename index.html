<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dosage Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%-20px;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dosage Calculator</h2>
    <img src="tirzvial.jpeg" alt="Tirzepatide vial" style="width:100%; max-width:300px; display:block; margin: 0 auto 20px auto; border-radius:8px;">
    <label for="concentration">Concentration (mg/mL) - see image above, enter number in green box:</label>
    <input type="number" id="concentration" step="0.01" placeholder="e.g. 10">

    <label for="dose">Desired Dose (mg):</label>
    <input type="number" id="dose" step="0.01" placeholder="e.g. 5">

    <button onclick="calculateDose()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateDose() {
      const concentration = parseFloat(document.getElementById('concentration').value);
      const dose = parseFloat(document.getElementById('dose').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(concentration) || isNaN(dose) || concentration <= 0) {
        resultDiv.textContent = 'Please enter valid values.';
        return;
      }

      const volume = dose / concentration;
      const units = volume * 100;

      resultDiv.innerHTML = `
        Volume to draw: <strong>${volume.toFixed(2)} mL</strong><br>
        Syringe units (1 mL = 100 units): <strong>${units.toFixed(1)} units</strong>
      `;
    }
  </script>
</body>
</html>
